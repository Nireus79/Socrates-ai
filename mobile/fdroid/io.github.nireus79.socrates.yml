AntiFeatures:
  NonFreeNet:
    en-US: Sends your messages to the AI provider you choose (Claude or OpenAI) with
      your own key; those services are not free software. Once a day it also fetches
      the text of a small card from the project's repository on GitHub, nothing about
      you is sent.
