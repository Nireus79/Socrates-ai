Builds:
  - versionName: 0.1.0-beta.5
    versionCode: 5
    commit: 143d2919051ffcc4c626c526a86b647dca5e6859
    subdir: mobile/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky golang-go nodejs npm
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm ci
      - cd ../engine
      - GOTOOLCHAIN=local go mod download
      - sdkmanager "ndk;26.3.11579264"
    scanignore:
      - mobile/node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - mobile/node_modules
    build:
      - export GOTOOLCHAIN=local
      - cd ../..
      - ./scripts/build-engine.sh
      - ./scripts/build-www.sh
      - npx cap sync android

