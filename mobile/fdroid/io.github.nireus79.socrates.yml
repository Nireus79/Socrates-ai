AutoName: Socrates

RepoType: git
Repo: https://github.com/Nireus79/Socrates-ai.git

Builds:
  - versionName: 0.1.0-beta.3
    versionCode: 3
    commit: FULL_COMMIT_HASH_OF_THE_TAG
    subdir: mobile/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky golang-1.26-go nodejs npm
      - update-alternatives --auto java
    prebuild:
      - (cd ../.. && npm ci)
      - (cd ../../../engine && GOTOOLCHAIN=local /usr/lib/go-1.26/bin/go mod download)
    scanignore:
      - mobile/node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - mobile/node_modules
    build:
      - sdkmanager "ndk;26.3.11579264"
      - export PATH=/usr/lib/go-1.26/bin:$PATH
      - export GOTOOLCHAIN=local
      - (cd ../.. && scripts/build-engine.sh)
      - (cd ../.. && npm ci --offline && scripts/build-www.sh && npx cap sync android)

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$
CurrentVersion: 0.1.0-beta.3
CurrentVersionCode: 3
