AntiFeatures:
  Ads:
    en-US: A small card at the bottom of the chat shows the project's own message,
      a request to sponsor it. It is not third-party advertising, there is no ad network,
      and it can be hidden.
  NonFreeNet:
    en-US: Sends your messages to the AI provider you choose (Claude or OpenAI) with
      your own key; those services are not free software.
  Tracking:
    en-US: Once a day, while the sponsor card is shown, it fetches a small text file
      from the project's repository on GitHub. Nothing about you is sent, but GitHub
      sees your address. Hiding the card stops it for that session.
