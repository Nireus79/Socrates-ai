name: Simple Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    name: Simple Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify workflow is running
        run: |
          echo "✓ GitHub Actions Workflow is active!"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
